<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="/Style/styles.css" />

    <link rel="icon" type="image/png" href="img/Favicon/sun_4837942.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="weather">
    <video autoplay loop muted playsinline class="weather__video">
      <source
        src="img/clouds-drifting-across-the-blue-sky-2025-12-17-19-28-48-utc.mov"
        type="video/mp4"
      />
    </video>

    <main class="weather__container glass">
      <h1 class="weather__title">Weather in Motion</h1>

      <div class="weather__search">
        <input
          type="search"
          class="weather__input"
          placeholder="Enter city"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" class="weather__button">Search</button>
      </div>

      <div class="weather__result"></div>
    </main>

    <script type="module" src="JS/main.js"></script>
  </body>
</html>
